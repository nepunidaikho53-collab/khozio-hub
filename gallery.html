<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Khozio Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    .header {
      text-align: center;
      max-width: 600px;
      margin-bottom: 2rem;
      width: 100%;
    }

    .nav-back {
      display: inline-block;
      color: orangered;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .header h1 {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      letter-spacing: 1px;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      color: #8b949e;
      font-size: 0.95rem;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 850px;
    }

    .category-card {
      background-color: #161f30;
      border: 1px solid #283548;
      border-radius: 14px;
      padding: 1.5rem 1rem;
      text-decoration: none;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .category-card:hover,
    .category-card:active {
      transform: translateY(-3px);
      border-color: orangered;
      background-color: #1c273c;
    }

    .card-icon {
      font-size: 2.2rem;
      margin-bottom: 0.75rem;
    }

    .category-card h2 {
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
    }

    .category-card span {
      font-size: 0.85rem;
      color: orangered;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="nav-back">← Home</a>
    <h1>KHOZIO GALLERY</h1>
    <p class="subtitle">Select a category to view photos and videos</p>
  </header>

  <main class="categories-grid">
    <a href="cool.html" class="category-card">
      <div class="card-icon">😎</div>
      <h2>Cool Khozio</h2>
      <span>View Collection →</span>
    </a>

    <a href="kid.html" class="category-card">
      <div class="card-icon">👶</div>
      <h2>Kid Khozio</h2>
      <span>View Collection →</span>
    </a>

    <a href="happy.html" class="category-card">
      <div class="card-icon">😄</div>
      <h2>Happy Khozio</h2>
      <span>View Collection →</span>
    </a>

    <a href="pain.html" class="category-card">
      <div class="card-icon">🤕</div>
      <h2>Khozio In Pain</h2>
      <span>View Collection →</span>
    </a>

    <a href="shirtless.html" class="category-card">
      <div class="card-icon">💪</div>
      <h2>Khozio Shirtless</h2>
      <span>View Collection →</span>
    </a>

    <a href="playing.html" class="category-card">
      <div class="card-icon">🎮</div>
      <h2>Khozio Playing</h2>
      <span>View Collection →</span>
    </a>
  </main>

</body>
</html>
