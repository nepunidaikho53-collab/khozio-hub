<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>About Khozio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem 4rem;
    }

    .nav-back {
      display: inline-block;
      color: orangered;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      align-self: flex-start;
      max-width: 600px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .about-card {
      background-color: #161f30;
      border: 1px solid #283548;
      border-radius: 20px;
      padding: 2.25rem 1.75rem;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .profile-avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid orangered;
      object-fit: cover;
      margin: 0 auto 1.5rem;
      display: block;
      background: #0d131f;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 0.95rem;
      color: #ff9800;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .bio-content {
      font-size: 1.05rem;
      line-height: 1.75;
      color: #cbd5e1;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0d131f;
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid #283548;
    }

    #loadingText {
      color: #8b949e;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <a href="index.html" class="nav-back">← Back to Hub</a>

  <div class="about-card">
    <img src="IMG_6226.JPG.jpeg" alt="Khozio" class="profile-avatar" onerror="this.style.display='none'">
    <h1>ABOUT KHOZIO</h1>
    <p class="tagline">The Legend Behind the Hub</p>

    <div class="bio-content" id="bioBox">
      <p id="loadingText">Loading bio...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://fdufetvyfwtlhbdlbbly.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkdWZldHZ5Znd0bGhiZGxiYmx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNDAwNzcsImV4cCI6MjEwNjYxNjA3N30.77HH-STdXQi0EuCy84T37kwJD5lEFQscDmhTttllqYo";

    async function fetchAboutParagraph() {
      const bioBox = document.getElementById("bioBox");
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/site_content?key=eq.about_khozio`, {
          headers: { "apikey": SUPABASE_KEY }
        });
        const data = await res.json();

        if (Array.isArray(data) && data.length > 0 && data[0].content) {
          bioBox.innerText = data[0].content;
        } else {
          bioBox.innerText = "No description written yet.";
        }
      } catch (err) {
        bioBox.innerText = "Could not load bio: " + err.message;
      }
    }

    fetchAboutParagraph();
  </script>
</body>
</html>
