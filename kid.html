<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KID KHOZIO Gallery</title>
    <link rel="stylesheet" href="/cool.css">
    <style>
        body { font-family: sans-serif; text-align: center; background: #1e1e1e; color: #fff; padding: 20px; }
        h2 { margin-top: 40px; color: #ffca28; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        
        .gallery img, .gallery video { 
            width: 100%; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .gallery img:hover, .gallery video:hover { transform: scale(1.03); }

        /* Modal / Expanded View Styles */
        #modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        #modalContentContainer {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #modalImg, #modalVideo {
            max-width: 85vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.7);
            display: none;
        }

        /* Modal Control Buttons */
        .modal-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            font-size: 24px;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 50%;
            transition: background 0.2s, border-color 0.2s;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #fff;
        }

        #closeBtn { top: 20px; right: 25px; position: fixed; font-size: 28px; width: 45px; height: 45px; }
        #prevBtn { left: 20px; top: 50%; transform: translateY(-50%); }
        #nextBtn { right: 20px; top: 50%; transform: translateY(-50%); }
    </style>
</head>
<body>
    <h1>KID KHOZIO</h1>
    
    <h2>Photos</h2>
    <div class="gallery" id="imageContainer"></div>

    <h2>Videos</h2>
    <div class="gallery" id="videoContainer"></div>

    <!-- Modal for Expanded Media (Images & Videos) -->
    <div id="modal">
        <button id="closeBtn" class="modal-btn" onclick="closeModal()">×</button>
        <button id="prevBtn" class="modal-btn" onclick="changeMedia(-1)">&#10094;</button>
        <button id="nextBtn" class="modal-btn" onclick="changeMedia(1)">&#10095;</button>
        
        <div id="modalContentContainer">
            <img id="modalImg" src="" alt="Expanded View">
            <video id="modalVideo" src="" controls autoplay></video>
        </div>
    </div>

    <script>
        // Lists of filenames (empty strings are automatically filtered out)
        const images = ["kid.jpg","kid1.png","kid2.png","kid4.png"].filter(Boolean);
        const videos = ["sample-video.mp4"].filter(Boolean); // Add your video filenames here

        let currentIndex = 0;
        let currentCollection = []; // Tracks whether we are browsing 'images' or 'videos'

        const modal = document.getElementById("modal");
        const modalImg = document.getElementById("modalImg");
        const modalVideo = document.getElementById("modalVideo");

        // Populate Image Gallery
        const imageContainer = document.getElementById("imageContainer");
        images.forEach((img, index) => {
            const imageElement = document.createElement("img");
            imageElement.src = img;
            imageElement.alt = img;
            imageElement.onclick = () => openModal(images, index, 'image');
            imageElement.onerror = function() {
                this.style.border = "3px solid red";
                console.error("Could not find image file: " + this.src);
            };
            imageContainer.appendChild(imageElement);
        });

        // Populate Video Gallery
        const videoContainer = document.getElementById("videoContainer");
        videos.forEach((vid, index) => {
            const videoElement = document.createElement("video");
            videoElement.src = vid;
            videoElement.muted = true;
            videoElement.onclick = () => openModal(videos, index, 'video');
            videoElement.onerror = function() {
                this.style.border = "3px solid red";
                console.error("Could not find video file: " + this.src);
            };
            videoContainer.appendChild(videoElement);
        });

        function openModal(collection, index, type) {
            currentCollection = collection;
            currentIndex = index;
            modal.style.display = "flex";
            updateModalContent(type);
        }

        function updateModalContent(type) {
            // Stop/reset video playback when switching
            modalVideo.pause();
            
            const currentSrc = currentCollection[currentIndex];

            if (type === 'video' || currentSrc.endsWith('.mp4') || currentSrc.endsWith('.webm') || currentSrc.endsWith('.ogg')) {
                modalImg.style.display = "none";
                modalVideo.style.display = "block";
                modalVideo.src = currentSrc;
                modalVideo.play();
            } else {
                modalVideo.style.display = "none";
                modalImg.style.display = "block";
                modalImg.src = currentSrc;
            }
        }

        function changeMedia(direction) {
            currentIndex += direction;
            // Loop around if out of bounds
            if (currentIndex < 0) {
                currentIndex = currentCollection.length - 1;
            } else if (currentIndex >= currentCollection.length) {
                currentIndex = 0;
            }
            // Determine type based on collection
            const type = currentCollection === videos ? 'video' : 'image';
            updateModalContent(type);
        }

        function closeModal() {
            modal.style.display = "none";
            modalVideo.pause();
        }

        // Keyboard accessibility (Arrow keys to navigate, Escape to close)
        document.addEventListener('keydown', function(event) {
            if (modal.style.display === "flex") {
                if (event.key === "Escape") closeModal();
                if (event.key === "ArrowLeft") changeMedia(-1);
                if (event.key === "ArrowRight") changeMedia(1);
            }
        });
    </script>

<script>

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // CHANGE THIS for each file: 'kid', 'cool', 'shirtless', 'happy', 'pain', or 'playing'
  const CURRENT_PAGE_CATEGORY = "kid"; 

  async function loadCloudMedia() {
    const { data, error } = await supabase
      .from('uploads')
      .select('*')
      .eq('category', CURRENT_PAGE_CATEGORY)
      .order('created_at', { ascending: false });

    if (error) {
      console.error("Error fetching media:", error);
      return;
    }

    data.forEach(item => {
      if (item.media_type === "image") {
        images.unshift(item.file_url);

        const img = document.createElement("img");
        img.src = item.file_url;
        img.onclick = () => openModal(images, 0, 'image');
        imageContainer.prepend(img);
      } else if (item.media_type === "video") {
        videos.unshift(item.file_url);

        const vid = document.createElement("video");
        vid.src = item.file_url;
        vid.muted = true;
        vid.onclick = () => openModal(videos, 0, 'video');
        videoContainer.prepend(vid);
      }
    });
  }

  loadCloudMedia();
</script>
</body>
</html>
